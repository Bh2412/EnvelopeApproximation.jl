name: CI
on:
  push:
    branches: [ "main", "clean_main", "WIP"]
  pull_request:
    branches: [ "main", "clean_main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      # Caching helps speed up subsequent runs
      - uses: julia-actions/cache@v2
      - uses: Swatinem/rust-cache@v2

      - name: Build and Test
        run: |
          # Ensure the target directory exists for the .so
          mkdir -p src/EnvelopeAnalysis
          make